output_dir: data/out
images: data/out/images
use_gpu: true

resources:
  cpu:
    partition: cpu_p
    qos: cpu_normal
    cpu: 18
    gpu: 0
    mem_mb: 250000
  gpu:
    partition: gpu_p
    qos: gpu_long
    cpu: 24
    gpu: 1
    mem_mb: 250000

defaults:
  integration:
    raw_counts: layers/counts
    norm_counts: layers/normcounts
    var_mask:  # Use var_masks generated from the script
      - 1000_Intersecting_Genes
      - 2000_Intersecting_Genes
      - 3000_Intersecting_Genes
      - 4000_Intersecting_Genes
    save_subset: false
  datasets: concatenated_object_filtered
  batch: batch_covar_split # Replace with covariate from PCR
  umap_colors:
    - Dataset
    - ID
    - batch_covar_split
    - Cell_Type_Harmonized

DATASETS:
  concatenated_object_filtered:
    input:
      integration:
        #all_datasets: /lustre/groups/ml01/workspace/hpca/data/20250130_adata_labelled_hvg_mask.zarr  # Preprocessed dataset
        all_datasets: /lustre/groups/ml01/workspace/hpca/data/2025-03-13_hvg_mask_filtered.zarr
      metrics: integration
    integration:
      label:
        - Cell_Type_Harmonized
      batch: batch_covar_split
      methods:
        # Methods under Harmony
        #harmony:
        # harmonypy:
        #     sigma: 0.1
        #     key: Dataset
        #     n_comps:
        #       - 10
        #       - 30
        harmony_pytorch:
            sigma: 0.1
            batch_key: batch_covar_split
            n_comps: 30
        # Methods under scVI-tools
        #scvi_tools:
        scvi:
            n_hidden: 128
            max_epochs: 100
            early_stopping: true
        sysvi:
            system_key: suspension_type
            categorical_covariate_keys:
              - batch_covar_split
            early_stopping: true
        drvi:
            early_stopping: true
        scanvi:
            max_epochs: 50
            early_stopping: true
            categorical_covariate_keys:
              - batch_covar_split
            # continuous_covariate_keys: #Add if necessary
        # Methods under scArches
        #scarches:
        # scgen:
        #    hidden_layer_sizes: [128, 128]
        #    n_epochs: 100 # Not sure how many epochs scgen needs
        #    early_stopping_kwargs:
        #      early_stopping_metric: val_loss
        #      patience: 20
        #      threshold: 0
        #      reduce_lr: true
        #      lr_patience: 13
        #      lr_factor: 0.1
        scpoli:
            cell_type_keys:
              - Cell_Type_Harmonized
            embedding_dims: 5
            recon_loss: nb
            n_epochs: 100
            early_stopping_kwargs:
              early_stopping_metric: val_prototype_loss
              mode: min
              threshold: 0
              patience: 20
              reduce_lr: true
              lr_patience: 13
              lr_factor: 0.1
         # bbknn:
         # neighbors_within_batch: 3 #not sure if this is the right value
                # combat:
                #   covariates:
                #     - Dataset
                # scanorama:
                #   batch_size: 100
    metrics:
      methods:
         - nmi
         - ari
         - asw_label
         - asw_batch
         - cell_cycle
        #- clisi
        # - ilisi
         - graph_connectivity
        # - isolated_label_asw
        # - isolated_label_f1
         - pcr
      label: 
         - Cell_Type_Harmonized
      batch:
         - batch_covar_split
         - suspension_type
          #unintegrated: X
          #overwrite_file_id: true
